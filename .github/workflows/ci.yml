name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate platform bindings
        run: dart run pigeon --input pigeons/conduit_platform_apis.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  desktop-build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            enable: windows
            target: windows
          - platform: macOS
            os: macos-26
            enable: macos
            target: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target
        shell: bash
        run: flutter config --enable-${{ matrix.enable }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate platform bindings
        run: dart run pigeon --input pigeons/conduit_platform_apis.dart

      - name: Build unsigned release
        run: flutter build ${{ matrix.target }} --release
