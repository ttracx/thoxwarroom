name: Native Apple CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build-and-test:
    name: Unsigned macOS tests and iOS build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: "1"
      CI_DERIVED_DATA: build/github-ci-derived
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Python build dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Bootstrap and run secret-free native CI
        run: ./scripts/bootstrap.sh
