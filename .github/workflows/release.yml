name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-notes:
    name: Validate Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate baked release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dart run tool/validate_release_notes.dart --version "$VERSION"

  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: validate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Create Release with Notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true

  # ─── Android ───────────────────────────────────────────────────
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle and caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/conduit-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}" | base64 --decode > key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        working-directory: android

      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Update Release with Artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk,build/app/outputs/bundle/release/app-release.aab"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  # ─── iOS ───────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-26
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --verbose

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build iOS App
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/Release-iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/thoxwarroom.ipa Payload
          cd ../ipa

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release
          path: |
            build/ios/ipa/*.ipa

      - name: Update Release with IPA
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/ios/ipa/thoxwarroom.ipa"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  # ─── macOS ─────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-26
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods (macOS)
        uses: actions/cache@v4
        with:
          path: |
            macos/Pods
          key: ${{ runner.os }}-macos-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-pods-

      - name: Install CocoaPods (macOS)
        run: |
          cd macos
          pod install --verbose

      - name: Build macOS App
        run: flutter build macos --release

      - name: Create DMG
        run: |
          # Build the DMG installer from the .app bundle
          APP_PATH="build/macos/Build/Products/Release/ThoxWarRoom.app"
          DMG_PATH="build/macos/ThoxWarRoom-${GITHUB_REF_NAME}.dmg"

          # Create a temporary DMG directory
          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          ln -s /Applications build/dmg/Applications

          # Create the DMG
          hdiutil create -volname "ThoxWarRoom" -srcfolder build/dmg -ov -format UDZO "$DMG_PATH"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: |
            build/macos/*.dmg

      - name: Update Release with DMG
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/macos/ThoxWarRoom-${{ github.ref_name }}.dmg"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  # ─── Windows ───────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSIX + ZIP)
    runs-on: windows-latest
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows App
        run: flutter build windows --release

      - name: Create ZIP package
        run: |
          $source = "build\windows\x64\runner\Release"
          $zipPath = "build\windows\ThoxWarRoom-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "$source\*" -DestinationPath "$zipPath"

      - name: Create MSIX installer
        run: dart run msix:create
        continue-on-error: true  # MSIX requires a cert; skip if not configured

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: |
            build/windows/*.zip
            build/windows/**/*.msix

      - name: Update Release with Windows Artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/windows/ThoxWarRoom-${{ github.ref_name }}-windows-x64.zip"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true