<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ThoxOS Chat UX — Reference (golden message)</title>
<!-- Response formatting (F1) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<!-- In-chat visualizations (F2) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
<style>
  :root{
    --thox-green:#05A451; --thox-green-2:#0bd06a;
    --bg:#0b0d10; --panel:#12161b; --panel-2:#171c22; --line:#232a32;
    --text:#e7edf3; --muted:#9aa7b4; --thox-menu-h:52px; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--thox-green-2)}
  .menubar{position:sticky;top:0;height:var(--thox-menu-h);display:flex;align-items:center;
    gap:10px;padding:0 16px;background:rgba(11,13,16,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);z-index:50}
  .brandmark{width:22px;height:22px;border-radius:6px;background:
    conic-gradient(from 210deg,var(--thox-green),var(--thox-green-2),var(--thox-green))}
  .menubar b{font-weight:700;letter-spacing:.2px}
  .menubar .cap{margin-left:auto;color:var(--muted);font-size:12px}
  .wrap{display:grid;grid-template-columns:1fr;max-width:1200px;margin:0 auto}
  .wrap.with-panel{grid-template-columns:1fr 420px}
  @media(max-width:820px){.wrap.with-panel{grid-template-columns:1fr}}
  .transcript{padding:18px 16px 80px}
  .msg{display:flex;gap:12px;margin:0 0 18px}
  .avatar{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--thox-green),#0a7d3f);color:#fff;font-weight:800;font-size:13px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;min-width:0;flex:1 1 auto}
  .bubble :first-child{margin-top:0}.bubble :last-child{margin-bottom:0}
  .bubble pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
  .bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .bubble p code{background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:.5px 5px}
  .block-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
  .chartbox{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:10px;height:220px}
  .mermaid{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto}
  /* Artifact card (F3) */
  .artifact-card{display:flex;align-items:center;gap:12px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
  .artifact-card:hover{border-color:var(--thox-green)}
  .artifact-card .glyph{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:#0d1117;border:1px solid var(--line);color:var(--thox-green-2);font-weight:800}
  .artifact-card .t{font-weight:650}.artifact-card .s{color:var(--muted);font-size:12px}
  .artifact-card .open{margin-left:auto;color:var(--thox-green-2);font-size:13px;font-weight:650}
  /* Artifact panel (F3) */
  .panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
    height:calc(100vh - var(--thox-menu-h));position:sticky;top:var(--thox-menu-h)}
  .panel.hidden{display:none}
  .panel .head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:4px;background:#0d1117;border:1px solid var(--line);border-radius:9px;padding:3px}
  .tabs button{background:none;border:0;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600}
  .tabs button.active{background:var(--panel-2);color:var(--text)}
  .panel .head .ver{color:var(--muted);font-size:12px}
  .panel .head .sp{margin-left:auto;display:flex;gap:8px}
  .iconbtn{background:#0d1117;border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-size:13px}
  .iconbtn:hover{border-color:var(--thox-green)}
  .panel .body{flex:1;min-height:0}
  .panel iframe{width:100%;height:100%;border:0;background:#fff;border-radius:0 0 0 0}
  .panel pre{margin:0;height:100%;overflow:auto;background:#0d1117}
  /* Fullscreen (F4) */
  .fs{position:fixed;inset:0;z-index:999;background:#0b0d10;display:none;flex-direction:column;
    padding-top:env(safe-area-inset-top)}
  .fs.open{display:flex}
  .fs .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .fs iframe{flex:1;border:0;background:#fff}
  /* Sandpack surface (F5) */
  .sandpack{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  @media(max-width:640px){.sandpack{grid-template-columns:1fr}}
  .sandpack .files{background:#0d1117}
  .sandpack .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#0a0e13}
  .sandpack .tabbar button{background:none;border:0;color:var(--muted);padding:7px 12px;cursor:pointer;font-size:12px}
  .sandpack .tabbar button.active{color:var(--thox-green-2);border-bottom:2px solid var(--thox-green)}
  .sandpack textarea{width:100%;height:190px;border:0;background:#0d1117;color:#e7edf3;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:12px;resize:none;outline:none}
  .sandpack iframe{width:100%;height:calc(190px + 33px);border:0;background:#fff}
  /* Digital human turn (F6) */
  .dh{background:linear-gradient(180deg,rgba(5,164,81,.08),transparent);border:1px solid var(--line);
    border-left:3px solid var(--thox-green);border-radius:10px;padding:12px 14px}
  .dh .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .dh .persona{font-weight:700}
  .dh .status{font-size:11px;color:#0b0d10;background:var(--thox-green-2);border-radius:20px;padding:1px 9px;font-weight:700}
  .dh .status.running{background:#f5b301}
  .dh .dot{width:7px;height:7px;border-radius:50%;background:var(--thox-green-2);
    box-shadow:0 0 0 0 rgba(11,208,106,.6);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,208,106,.6)}70%{box-shadow:0 0 0 8px rgba(11,208,106,0)}100%{box-shadow:0 0 0 0 rgba(11,208,106,0)}}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:12px}
</style>
</head>
<body>
  <div class="menubar">
    <span class="brandmark"></span><b>ThoxOS</b>
    <span style="color:var(--muted)">Chat UX — reference</span>
    <span class="cap">golden message · F1–F6</span>
  </div>

  <div class="wrap" id="wrap">
    <div class="transcript">
      <div class="msg">
        <div class="avatar">TX</div>
        <div class="bubble" id="bubble"><!-- rendered from blocks[] --></div>
      </div>
      <div class="foot">Rendered from the ThoxBlock contract · docs/CHAT_UX_STANDARD.md · Your AI. Your Data. Your Rules.™</div>
    </div>

    <aside class="panel hidden" id="panel">
      <div class="head">
        <div class="tabs"><button class="active" data-tab="preview">Preview</button><button data-tab="code">Code</button></div>
        <span class="ver">v1</span>
        <div class="sp"><button class="iconbtn" id="fsBtn">⤢ Fullscreen</button><button class="iconbtn" id="closeBtn">✕</button></div>
      </div>
      <div class="body">
        <iframe id="artFrame" sandbox="allow-scripts"></iframe>
        <pre id="artCode" style="display:none"><code class="language-html"></code></pre>
      </div>
    </aside>
  </div>

  <div class="fs" id="fs">
    <div class="bar"><span class="brandmark"></span><b>ThoxOS</b><span style="color:var(--muted)">Artifact · fullscreen</span>
      <button class="iconbtn" id="fsClose" style="margin-left:auto">✕ Close</button></div>
    <iframe id="fsFrame" sandbox="allow-scripts"></iframe>
  </div>

<script>
// ---- The golden message, expressed as ThoxBlocks (the wire contract) ----------------
const ARTIFACT_HTML = `<!doctype html><html><head><meta charset=utf-8><style>
  body{margin:0;font:14px system-ui;background:#0b0d10;color:#e7edf3;display:grid;place-items:center;height:100vh}
  .card{padding:24px 28px;border:1px solid #05A451;border-radius:16px;text-align:center}
  h1{margin:.2em 0;background:linear-gradient(90deg,#05A451,#0bd06a);-webkit-background-clip:text;color:transparent}
  button{margin-top:12px;background:#05A451;border:0;color:#fff;padding:8px 16px;border-radius:9px;cursor:pointer}
</style></head><body><div class=card><h1 id=n>0</h1><div>ThoxOS artifact — live HTML</div>
<button onclick="document.getElementById('n').textContent=+document.getElementById('n').textContent+1">Increment</button>
</div></body></html>`;

const blocks = [
  {type:"markdown", text:"**ThoxOS chat** renders a typed block stream. This paragraph is Markdown with a list, an inline `code` span, and math:\n\n- sanitized HTML (DOMPurify)\n- syntax-highlighted code\n- KaTeX: $\\int_0^1 x^2\\,dx = \\tfrac{1}{3}$"},
  {type:"code", lang:"typescript", text:"// F1 — highlighted, copyable\nasync function ask(q: string) {\n  const r = await ox.chat([{ role: 'user', content: q }], { reasoning: true });\n  return r.content;\n}"},
  {type:"chart", chart:"line", title:"Fleet tokens / hr",
   data:{labels:["Mon","Tue","Wed","Thu","Fri"],values:[12,19,15,27,32]}},
  {type:"mermaid", source:"graph LR; U[User]-->C[ThoxOS Chat]; C-->R[ThoxRoute]; R-->O[ox-alpha]; R-->L[Local model]"},
  {type:"artifact", artifactId:"a1", kind:"html", title:"Counter dashboard"},
  {type:"sandpack", template:"vanilla", files:{
    "index.html":"<h2 style='font-family:system-ui'>Edit me →</h2>\n<button id=b>Tap</button>",
    "script.js":"document.getElementById('b').onclick=()=>alert('ThoxOS Sandpack live!')"}},
  {type:"dh_turn", persona:"Victoria", status:"running",
   text:"Drafting the launch reply and classifying 3 inbox threads. Crossing an external boundary (send) will pause for your approval."}
];

// ---- Renderers: one per block type (mirrors native surfaces) -------------------------
marked.setOptions({highlight:(c,l)=>hljs.getLanguage(l)?hljs.highlight(c,{language:l}).value:hljs.highlightAuto(c).value});
const bubble = document.getElementById('bubble');

function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

for(const b of blocks){
  if(b.type==="markdown"){
    const d=el(`<div>${DOMPurify.sanitize(marked.parse(b.text))}</div>`); bubble.append(d);
  } else if(b.type==="code"){
    const pre=el(`<pre><code class="language-${b.lang}"></code></pre>`);
    pre.querySelector('code').textContent=b.text; hljs.highlightElement(pre.querySelector('code')); bubble.append(pre);
  } else if(b.type==="chart"){
    bubble.append(el(`<div class="block-title">${b.title||"chart"}</div>`));
    const box=el(`<div class="chartbox"><canvas></canvas></div>`); bubble.append(box);
    new Chart(box.querySelector('canvas'),{type:b.chart,data:{labels:b.data.labels,
      datasets:[{data:b.data.values,borderColor:'#0bd06a',backgroundColor:'rgba(11,208,106,.15)',fill:true,tension:.35}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9aa7b4'}},y:{ticks:{color:'#9aa7b4'}}},maintainAspectRatio:false}});
  } else if(b.type==="mermaid"){
    bubble.append(el(`<div class="block-title">mermaid</div>`));
    const m=el(`<div class="mermaid">${b.source}</div>`); bubble.append(m);
  } else if(b.type==="artifact"){
    const card=el(`<div class="artifact-card"><div class="glyph">&lt;/&gt;</div>
      <div><div class="t">${b.title}</div><div class="s">artifact · ${b.kind} · click to open panel</div></div>
      <div class="open">Open ▸</div></div>`);
    card.onclick=()=>openArtifact(ARTIFACT_HTML); bubble.append(card);
  } else if(b.type==="sandpack"){
    bubble.append(el(`<div class="block-title">sandpack · live code (F5)</div>`));
    bubble.append(buildSandpack(b.files));
  } else if(b.type==="dh_turn"){
    bubble.append(el(`<div class="dh"><div class="head"><span class="dot"></span>
      <span class="persona">${b.persona}</span><span class="status ${b.status}">${b.status}</span></div>
      <div>${DOMPurify.sanitize(marked.parseInline(b.text))}</div></div>`));
  }
}

// KaTeX + mermaid after DOM is populated
renderMathInElement(bubble,{delimiters:[{left:"$",right:"$",display:false}]});
mermaid.initialize({startOnLoad:false,theme:"dark",themeVariables:{primaryColor:"#0d1117",lineColor:"#05A451"}});
mermaid.run({nodes:bubble.querySelectorAll('.mermaid')});

// ---- Artifacts panel + fullscreen (F3/F4) -------------------------------------------
const wrap=document.getElementById('wrap'), panel=document.getElementById('panel'),
      artFrame=document.getElementById('artFrame'), artCode=document.getElementById('artCode');
function openArtifact(html){
  wrap.classList.add('with-panel'); panel.classList.remove('hidden');
  artFrame.srcdoc=html; artCode.querySelector('code').textContent=html; hljs.highlightElement(artCode.querySelector('code'));
}
document.getElementById('closeBtn').onclick=()=>{panel.classList.add('hidden');wrap.classList.remove('with-panel');};
panel.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{
  panel.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  const code=btn.dataset.tab==='code'; artCode.style.display=code?'block':'none'; artFrame.style.display=code?'none':'block';
});
const fs=document.getElementById('fs'), fsFrame=document.getElementById('fsFrame');
document.getElementById('fsBtn').onclick=()=>{fsFrame.srcdoc=artFrame.srcdoc;fs.classList.add('open');};
document.getElementById('fsClose').onclick=()=>fs.classList.remove('open');

// ---- Minimal Sandpack-style live sandbox (F5) ---------------------------------------
function buildSandpack(files){
  const root=el(`<div class="sandpack"><div class="files"><div class="tabbar"></div></div>
    <iframe sandbox="allow-scripts"></iframe></div>`);
  const tabbar=root.querySelector('.tabbar'), filesCol=root.querySelector('.files'), frame=root.querySelector('iframe');
  const names=Object.keys(files); const areas={};
  function run(){
    const html=(files["index.html"]||"")+`\n<script>${files["script.js"]||""}<\/script>`;
    frame.srcdoc=html;
  }
  names.forEach((n,i)=>{
    const tab=el(`<button class="${i===0?'active':''}">${n}</button>`);
    const ta=el(`<textarea spellcheck="false" style="${i===0?'':'display:none'}"></textarea>`);
    ta.value=files[n]; areas[n]=ta;
    ta.oninput=()=>{files[n]=ta.value;run();};
    tab.onclick=()=>{tabbar.querySelectorAll('button').forEach(x=>x.classList.remove('active'));tab.classList.add('active');
      Object.values(areas).forEach(a=>a.style.display='none'); ta.style.display='block';};
    tabbar.append(tab); filesCol.append(ta);
  });
  run(); return root;
}
</script>
</body>
</html>
