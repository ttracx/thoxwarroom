name: ThoxWarRoom
options:
  bundleIdPrefix: ai.thox.warroom
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.5"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "4.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: DVJ6Z5343U
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

packages:
  WarRoomCore:
    path: Packages/WarRoomCore
  WarRoomAppleInfrastructure:
    path: Packages/WarRoomAppleInfrastructure
  WarRoomOpenWebUI:
    path: Packages/WarRoomOpenWebUI
  WarRoomHermes:
    path: Packages/WarRoomHermes
  WarRoomMesh:
    path: Packages/WarRoomMesh

targets:
  ThoxWarRoom macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.thox.warroom
        PRODUCT_NAME: ThoxWarRoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 THOX AI LLC"
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSUIElement: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/ThoxWarRoom.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WarRoomCore
      - package: WarRoomAppleInfrastructure
      - package: WarRoomOpenWebUI
      - package: WarRoomHermes
      - package: WarRoomMesh
    preBuildScripts:
      - name: Ensure generated app icons
        script: |
          "$SRCROOT/scripts/ensure_appiconsets.sh"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - ThoxWarRoomTests macOS
      gatherCoverageData: false

  ThoxWarRoom iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.thox.warroom
        PRODUCT_NAME: ThoxWarRoom
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ThoxWarRoom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 THOX AI LLC"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "THOX War Room uses local network access only to connect to AI providers you explicitly configure on this device or private infrastructure."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/ThoxWarRoom-iOS.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WarRoomCore
      - package: WarRoomAppleInfrastructure
      - package: WarRoomOpenWebUI
      - package: WarRoomHermes
      - package: WarRoomMesh
    preBuildScripts:
      - name: Ensure generated app icons
        script: |
          "$SRCROOT/scripts/ensure_appiconsets.sh"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - ThoxWarRoomTests iOS
      gatherCoverageData: false

  ThoxWarRoomTests macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: ThoxWarRoom macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.thox.warroom.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ThoxWarRoom.app/Contents/MacOS/ThoxWarRoom

  ThoxWarRoomTests iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: ThoxWarRoom iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.thox.warroom.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ThoxWarRoom.app/ThoxWarRoom
